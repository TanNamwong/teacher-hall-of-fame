<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3454F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>ทำเนียบครูดีเด่น</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap">
<style>
/* Layout: bright gradient hero, colourful pastel tags per award, fixed emoji bottom nav, sub-tabs per topic */
:root{
  --bg:#FBFAFF; --surface:#FFFFFF; --soft:#F1F0FF; --line:#E4E2F7;
  --navy:#1B2A6B; --fg:#1B2A6B; --muted:#6670A0;
  --pink:#E8157F; --pink-ink:#FFFFFF; --blue:#3454F5;
  --k0bg:#FFE3F1; --k0fg:#B00E5F; --k1bg:#E3E9FF; --k1fg:#1F36B8; --k2bg:#FFF1C2; --k2fg:#855400;
  --k3bg:#D3F8EA; --k3fg:#0A7A55; --k4bg:#EBE1FF; --k4fg:#5B2FC4;
  --ok:#0E8F5A; --bad:#D12F55;
  --hero-a:#3454F5; --hero-b:#7B4DFF; --hero-c:#FF4DA6;
  --shadow:0 2px 12px rgba(52,84,245,.08);
  --display:'Prompt','Noto Sans Thai',system-ui,sans-serif;
  --body:'Noto Sans Thai','Sarabun',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1330; --surface:#171E4A; --soft:#1E2760; --line:#2E3978;
  --navy:#F0F2FF; --fg:#EEF0FF; --muted:#A3ADDD; --pink:#FF5DB1; --pink-ink:#1A0A16; --blue:#7C93FF;
  --k0bg:#4A1B3A; --k0fg:#FF9BCF; --k1bg:#1F2D6E; --k1fg:#A9B9FF; --k2bg:#4A3A10; --k2fg:#FFD56B;
  --k3bg:#124434; --k3fg:#6BE8BC; --k4bg:#33236B; --k4fg:#C6AEFF;
  --ok:#4FD39A; --bad:#FF7A93; --shadow:0 2px 14px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1330; --surface:#171E4A; --soft:#1E2760; --line:#2E3978;
  --navy:#F0F2FF; --fg:#EEF0FF; --muted:#A3ADDD; --pink:#FF5DB1; --pink-ink:#1A0A16; --blue:#7C93FF;
  --k0bg:#4A1B3A; --k0fg:#FF9BCF; --k1bg:#1F2D6E; --k1fg:#A9B9FF; --k2bg:#4A3A10; --k2fg:#FFD56B;
  --k3bg:#124434; --k3fg:#6BE8BC; --k4bg:#33236B; --k4fg:#C6AEFF;
  --ok:#4FD39A; --bad:#FF7A93; --shadow:0 2px 14px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.55;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:1.2rem;color:var(--navy);margin-bottom:10px}
h3{font-size:1rem;color:var(--navy);margin-bottom:8px}
.muted{color:var(--muted)}.small{font-size:.82rem}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 115%);color:#fff;border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 26px rgba(91,77,255,.3)}
.hero .mark{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1.7rem;flex:none}
.hero h1{font-size:1.3rem;font-weight:700;line-height:1.2;color:#fff}
.hero p{margin:2px 0 0;opacity:.92;font-size:.82rem}
.hero .deco{position:absolute;right:-6px;top:-10px;font-size:3.4rem;opacity:.16;transform:rotate(14deg);pointer-events:none}
.hero .deco.b{right:70px;top:auto;bottom:-14px;font-size:2.4rem;transform:rotate(-10deg)}
.hero .yearchip{margin-left:auto;background:rgba(255,255,255,.22);border-radius:14px;padding:6px 12px;text-align:center;line-height:1.2;position:relative}
.hero .yearchip b{display:block;font:700 1.15rem var(--display)}.hero .yearchip span{font-size:.65rem;opacity:.9}
.notice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--k2bg);color:var(--k2fg);border-radius:14px;padding:10px 14px;margin:12px 0 0;font-size:.85rem}
.notice>span:nth-child(2){flex:1;min-width:180px}.notice button{margin-left:auto}
#view{margin-top:16px}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;gap:2px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(52,84,245,.1);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav button{flex:1;max-width:190px;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;color:var(--muted);font:600 .7rem var(--body);padding:5px 4px;border-radius:14px;cursor:pointer;transition:.15s}
.bnav button .ic{font-size:1.4rem;line-height:1.25;filter:grayscale(.55);transition:.15s}
.bnav button[aria-selected="true"]{color:var(--pink);background:var(--k0bg)}
.bnav button[aria-selected="true"] .ic{filter:none;transform:translateY(-2px) scale(1.12)}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--navy);font:600 .84rem var(--body);padding:8px 12px;border-radius:10px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--pink);box-shadow:var(--shadow)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.stack{display:flex;flex-direction:column;gap:12px}
[hidden]{display:none!important}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
textarea{resize:vertical;min-height:68px}
input[type=checkbox]{width:auto}input[type=file]{padding:8px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2.5px solid var(--pink);outline-offset:1px}

.btn{font:600 .88rem var(--body);border-radius:12px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);padding:9px 16px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--pink);color:var(--pink)}
.btn.primary{background:linear-gradient(135deg,var(--pink),#FF5A5A 130%);border-color:transparent;color:var(--pink-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--pink-ink);transform:translateY(-1px)}
.btn.danger{border-color:var(--line);color:var(--bad)}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 11px;font-size:.78rem}

.avatar{width:100%;aspect-ratio:1;border-radius:16px;object-fit:cover;display:grid;place-items:center;color:#fff;font:700 2.2rem var(--display);background:var(--g,linear-gradient(135deg,#3454F5,#FF4DA6))}
.avatar.m{width:72px;border-radius:50%;font-size:1.6rem;flex:none}
.avatar.s{width:52px;border-radius:50%;font-size:1.2rem;flex:none}
.g0{--g:linear-gradient(135deg,#FF4DA6,#FF8A5B)}.g1{--g:linear-gradient(135deg,#3454F5,#12A8E8)}.g2{--g:linear-gradient(135deg,#FFB800,#FF7A3D)}.g3{--g:linear-gradient(135deg,#12C28D,#12A8E8)}.g4{--g:linear-gradient(135deg,#7B4DFF,#FF4DA6)}
.pick{display:flex;gap:14px;align-items:center}.pick>div:last-child{flex:1;min-width:0}

.alert{border-radius:14px;padding:11px 14px;font-size:.86rem;background:var(--k0bg);color:var(--k0fg)}
.alert.info{background:var(--k2bg);color:var(--k2fg)}.alert b{display:block;margin-bottom:2px}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.crit:last-of-type{border-bottom:0}
.crit .nm{font-weight:600;color:var(--navy)}.crit .ds{font-size:.78rem;color:var(--muted)}
.crit input{grid-column:2;grid-row:1/3;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.sumbar{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 8px 26px rgba(52,84,245,.22);margin-top:14px}
.sumin{display:flex;gap:16px;flex:1;align-items:center;flex-wrap:wrap}.sumin div{line-height:1.2}.sumin small{display:block;font-size:.68rem;color:var(--muted)}.sumin b{font:700 1.05rem var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:4px;min-width:90px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:99px;transition:width .2s}
.pill{display:inline-block;border-radius:999px;padding:2px 11px;font-size:.76rem;font-weight:700}
.pill.ok{background:var(--k3bg);color:var(--k3fg)}.pill.bad{background:var(--k0bg);color:var(--k0fg)}

.k0{--kbg:var(--k0bg);--kfg:var(--k0fg)}.k1{--kbg:var(--k1bg);--kfg:var(--k1fg)}.k2{--kbg:var(--k2bg);--kfg:var(--k2fg)}.k3{--kbg:var(--k3bg);--kfg:var(--k3fg)}.k4{--kbg:var(--k4bg);--kfg:var(--k4fg)}
.tag{display:inline-block;background:var(--kbg,var(--soft));color:var(--kfg,var(--navy));border-radius:10px;padding:2px 9px;font-size:.72rem;font-weight:600;margin-top:6px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{border-radius:16px;padding:10px 12px;background:var(--kbg);color:var(--kfg)}
.tile span{font-size:.72rem;display:block;opacity:.85}.tile b{font:700 1.35rem var(--display);font-variant-numeric:tabular-nums}
.hof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hof{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);transition:.15s}
.hof:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(232,21,127,.2)}
.hof .ph{position:relative;aspect-ratio:1/1}.hof .ph .avatar{border-radius:0;aspect-ratio:auto;height:100%;font-size:2.6rem}
.hof .badge{position:absolute;top:8px;right:8px;background:var(--surface);color:var(--pink);font:700 .78rem var(--display);padding:2px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hof .medal{position:absolute;top:6px;left:8px;font-size:1.6rem;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.hof .bd{padding:10px 12px 12px}.hof .nm{font:600 .92rem var(--display);color:var(--navy)}
.yr{color:var(--blue);font-weight:600;font-size:.78rem;margin-top:5px}
.rep{color:var(--k0fg);background:var(--k0bg);display:inline-block;border-radius:8px;padding:1px 8px;font-weight:700;font-size:.72rem;margin-top:5px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.item .info{flex:1;min-width:0}.item .info b{color:var(--navy)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}details[open] summary{margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.sumtbl{min-width:560px}.sumtbl th,.sumtbl td{vertical-align:top;padding:9px 10px}
.sumtbl thead th{background:var(--soft);color:var(--navy);font-size:.78rem}
.sumtbl tbody th{white-space:nowrap;color:var(--navy);font-family:var(--display)}.sumtbl td div+div{margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--kbg);color:var(--kfg);border-radius:999px;padding:4px 6px 4px 13px;font-size:.85rem;font-weight:600}
.chip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:1rem;line-height:1;padding:2px 6px;opacity:.7}
.empty{text-align:center;padding:28px 16px;color:var(--muted);border:2px dashed var(--line);border-radius:20px}
.empty .big{font-size:2.4rem;display:block;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:600;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px);text-align:center}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.back{border:0;background:none;color:var(--blue);font:600 .9rem var(--body);padding:4px 0 8px;cursor:pointer}
.grp{margin:14px 0 6px;font-weight:600}
.mrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--fg);font:inherit;cursor:pointer;box-shadow:var(--shadow)}
.mrow .mi{width:42px;height:42px;border-radius:14px;background:var(--kbg);color:var(--kfg);display:grid;place-items:center;font-size:1.3rem;flex:none}
.mrow .mt{flex:1;min-width:0}.mrow .mt b{display:block;color:var(--navy)}.mrow small{display:block;color:var(--muted);font-size:.78rem}
.chev{color:var(--muted);font-size:1.4rem;line-height:1;flex:none;transition:transform .15s}.chev.up{transform:rotate(90deg)}
.between{display:flex;gap:12px;align-items:center;justify-content:space-between}
.bignum{font:700 1.8rem var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.mix{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin-top:10px}.mix i{background:var(--kfg);min-width:4px}
.card.crow{padding:0}.crow.off .ct,.crow.off .ce{opacity:.5}
.chead{display:flex;align-items:center;gap:10px;padding:10px 12px}
.cmain{flex:1;min-width:0;display:flex;gap:10px;align-items:center;background:none;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer;padding:0}
.ce{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:1.25rem;flex:none}
.ct{min-width:0;flex:1}.ct b{display:block;color:var(--navy);font-size:.92rem}.ct small{display:block;color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cedit{padding:12px;border-top:1px dashed var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.sw{position:relative;display:inline-block;width:46px;height:26px;margin:0;flex:none}
.sw input{appearance:none;-webkit-appearance:none;width:46px;height:26px;margin:0;padding:0;border:0;border-radius:99px;background:var(--line);cursor:pointer;transition:.15s;position:relative}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.sw input:checked{background:var(--ok)}.sw input:checked::after{transform:translateX(20px)}
.bnav button{position:relative}
.bnav .dot{position:absolute;top:3px;left:calc(50% + 10px);width:11px;height:11px;border-radius:50%;background:var(--pink);border:2px solid var(--surface)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- PWA banners ---- */
.pwa-bar{position:fixed;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;justify-content:center;padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.pwa-card{pointer-events:auto;width:100%;max-width:560px;display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 14px 36px rgba(52,84,245,.3)}
.pwa-card img{width:48px;height:48px;border-radius:12px;flex:none}
.pwa-card .tx{flex:1;min-width:0;font-size:.84rem;line-height:1.4}.pwa-card .tx b{display:block;font:600 .95rem var(--display);color:var(--navy)}
.pwa-card .bt{display:flex;flex-direction:column;gap:6px}
.pwa-card .bt .btn{white-space:nowrap}
@media(max-width:420px){.pwa-card{flex-wrap:wrap}.pwa-card .bt{flex-direction:row;width:100%}.pwa-card .bt .btn{flex:1}}
</style>
</head>
<body>


<div class="wrap">
  <header class="hero">
    <span class="deco emo" aria-hidden="true">🎓</span><span class="deco b emo" aria-hidden="true">⭐</span>
    <div class="mark emo" aria-hidden="true">🏆</div>
    <div><h1>ทำเนียบครูดีเด่น</h1><p>ยกย่องคุณครูผู้สร้างแรงบันดาลใจ ✨</p></div>
    <div class="yearchip" id="yearchip"></div>
  </header>
  <div id="demo"></div>
  <main id="view"></main>
</div>
<nav class="bnav" role="tablist" id="tabs" aria-label="เมนูหลัก"></nav>
<div id="toast" class="toast" hidden></div>
<canvas id="confetti" hidden></canvas>

<script>
const TABS=[["hall","ทำเนียบ","🏆"],["eval","ประเมิน","✍️"],["teachers","ครู","👩‍🏫"],["rules","ตั้งค่า","⚙️"]];
const KEY="teacher-hall-of-fame-v1";
const CY=(()=>{const d=new Date();return d.getFullYear()+543-(d.getMonth()<4?1:0)})();
let memStore=null;
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString("th-TH",{maximumFractionDigits:2});
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const curYear=()=>S.curYear||CY;

const CRIT_EMO=["📈","💡","🤝","📖","🌟"];
function seed(){
  const crit=[["ผลสัมฤทธิ์ของผู้เรียน",30,"นักเรียนเก่งขึ้นแค่ไหน ดูจากผลเรียนและพัฒนาการ"],
    ["นวัตกรรมและการจัดการเรียนรู้",25,"สื่อ วิธีสอน หรือไอเดียใหม่ที่ใช้จริงในห้องเรียน"],
    ["การดูแลช่วยเหลือนักเรียน",20,"ใส่ใจ ให้คำปรึกษา และช่วยแก้ปัญหานักเรียนรายคน"],
    ["การพัฒนาตนเองและวิชาชีพ",15,"อบรม ทำผลงานวิชาการ เป็นแบบอย่างให้เพื่อนครู"],
    ["คุณธรรม จริยธรรม และวินัย",10,"ความประพฤติ ความรับผิดชอบ การมาปฏิบัติหน้าที่"]].map(([name,max,desc],i)=>({id:uid(),name,max,desc,active:true,e:CRIT_EMO[i]}));

function readPhoto(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=rej;
  fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    const m=360,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82))};im.src=fr.result};
  fr.readAsDataURL(file)})}

function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const cv=$("#confetti"),cx=cv.getContext("2d");cv.hidden=false;cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#FF4DA6","#3454F5","#FFC93C","#2FD6A0","#9B6BFF","#12A8E8"];
  const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:cols[Math.random()*6|0],a:Math.random()*6}));
  let f=0;(function step(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
    if(++f<110)requestAnimationFrame(step);else{cx.clearRect(0,0,cv.width,cv.height);cv.hidden=true}})();
}

function calc(){const crit=activeCrit();let s=0,m=0,any=false;

function updDup(){

function makePdf(jp){

    let sd=(+year*9301+49297+pi*77)%233280;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;

      g.font=`700 66px ${DISP}`;const label=`ปีการศึกษา ${year}`,tw=g.measureText(label).width+110;

    // การ์ด

      const base=cols===1?72:cols===2?56:44,d=Math.min(cw*.58,ch*.44),pad=cw*.07;

        g.font=`600 ${cf}px ${BODY}`;const catL=wrapTxt(g,e.cat,cw-2*pad-44).slice(0,2);

      const pw=Math.min(cw-2*pad,Math.max(...L.catL.map(s2=>g.measureText(s2).width))+44),ph=L.catL.length*L.cf*1.4+14;

async function posterShare(kind){
  const p=ui.poster;if(!p)return;let fs;
  if(kind==="pdf"){const jp=[];for(const f of p.files)jp.push({data:new Uint8Array(await f.blob.arrayBuffer()),w:f.w,h:f.h});fs=[new File([makePdf(jp)],`teacher-poster-${p.year}.pdf`,{type:"application/pdf"})]}
  else fs=p.files.map(f=>new File([f.blob],f.name,{type:"image/jpeg"}));
  if(kind!=="save"&&navigator.canShare&&navigator.canShare({files:fs})){
    try{await navigator.share({files:fs,title:`ครูดีเด่น ปีการศึกษา ${p.year}`});return}catch(err){if(err&&err.name==="AbortError")return}}
  fs.forEach((f,i)=>setTimeout(()=>{const u=URL.createObjectURL(f),a=document.createElement("a");a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)},i*400));
  toast(kind==="save"?"บันทึกรูปแล้ว 🖼️":"เครื่องนี้แชร์ไฟล์ตรง ๆ ไม่ได้ จึงบันทึกไฟล์ให้แทน")}

function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("ถ้าไม่มีไฟล์ขึ้น ให้ใช้ปุ่ม “คัดลอกข้อมูล” แทน")}
function importData(txt){
  try{const j=JSON.parse(txt);if(!Array.isArray(j.teachers)||!Array.isArray(j.criteria)||!Array.isArray(j.evals))throw 0;
    j.categories=j.categories||[];j.departments=j.departments||[];j.pass=j.pass??80;S=normalize(j);S.demo=false;save();render();toast("นำเข้าข้อมูลเรียบร้อย 🎉")}
  catch(e){toast("ข้อมูลไม่ถูกต้อง ลองใช้ไฟล์ที่สำรองจากแอปนี้")}}
document.addEventListener("click",async e=>{
  const ob=e.target.closest("[data-open]");if(ob){ui.sub.rules=ob.dataset.open;ui.ec=null;ui.addc=false;history.pushState({rs:1},"");render();scrollTo(0,0);return}
  if(e.target.closest("[data-back]")){if(history.state&&history.state.rs)history.back();else{ui.sub.rules="menu";render();scrollTo(0,0)}return}
  const tb=e.target.closest("[data-tab]");if(tb){if(tb.dataset.tab==="rules"&&tab==="rules")ui.sub.rules="menu";tab=tb.dataset.tab;location.hash=tab;render();scrollTo(0,0);return}

  const gt=e.target.closest("[data-goto]");if(gt){const [k,v]=gt.dataset.goto.split(":");tab=k;ui.sub[k]=v;location.hash=k;render();return}
  const cf=e.target.closest("[data-confirm]");
  if(cf){ if(!cf.classList.contains("armed")){cf.classList.add("armed");cf.dataset.t=cf.textContent;cf.textContent="กดอีกครั้งเพื่อยืนยัน";setTimeout(()=>{cf.classList.remove("armed");cf.textContent=cf.dataset.t},3000);return}
    const id=cf.dataset.id,k=cf.dataset.confirm;
    if(k==="import")return importData($("#imp").value);
    if(k==="reset"){S={v:3,teachers:[],criteria:seed().criteria,categories:seed().categories,departments:seed().departments,pass:80,curYear:null,evals:[],demo:false};ui.tid=null;save();render();toast("ล้างข้อมูลทั้งหมดแล้ว");return}
    if(k==="del-eval")S.evals=S.evals.filter(x=>x.id!==id);
    if(k==="del-t"){S.teachers=S.teachers.filter(x=>x.id!==id);S.evals=S.evals.filter(x=>x.tid!==id)}
    if(k==="del-crit"){S.criteria=S.criteria.filter(x=>x.id!==id);if(ui.ec===id)ui.ec=null}
    save();render();toast("ลบแล้ว");return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="pdf-make"){a.disabled=true;a.textContent="⏳ กำลังสร้าง…";
    try{const r=await buildPdf(ui.pdfYear);if(!r)toast("ยังไม่มีครูดีเด่นในปีที่เลือก");else{if(ui.pdf)URL.revokeObjectURL(ui.pdf.url);ui.pdf=r}}catch(err){toast("สร้าง PDF ไม่สำเร็จ ลองใหม่อีกครั้ง")}
    a.disabled=false;a.textContent="📄 สร้าง PDF";pdfOut()}
  if(act==="poster-make"){a.disabled=true;a.textContent="⏳ กำลังสร้าง…";
    try{const r=await buildPoster(ui.posterYear,+ui.posterTheme,S.school||"");if(!r)toast("ปีนี้ยังไม่มีครูดีเด่น");else{if(ui.poster)ui.poster.files.forEach(f=>URL.revokeObjectURL(f.url));ui.poster=r}}catch(err){toast("สร้างโปสเตอร์ไม่สำเร็จ ลองใหม่อีกครั้ง")}
    a.disabled=false;a.textContent="🖼️ สร้างโปสเตอร์";posterOut()}
  if(act==="poster-share")posterShare("share");
  if(act==="poster-save")posterShare("save");
  if(act==="poster-pdf")posterShare("pdf");
  if(act==="pdf-share")pdfShare();
  if(act==="pdf-save")pdfSave();
  if(act==="pdf-open"&&ui.pdf)window.open(ui.pdf.url,"_blank");
  if(act==="clear-demo"){S.teachers=S.teachers.filter(t=>!t.demo);const ids=new Set(S.teachers.map(t=>t.id));S.evals=S.evals.filter(x=>ids.has(x.tid));S.demo=false;save();render();toast("ล้างข้อมูลตัวอย่างแล้ว เริ่มเลย! 🚀")}
  if(act==="save-eval"){
    const {pct,any}=calc();if(!any)return toast("ยังไม่ได้กรอกคะแนนเลย 😅");
    const scores=activeCrit().map(c=>({n:c.name,s:Math.min(c.max,Math.max(0,parseFloat(ui.draft[c.id])||0)),m:c.max}));
    S.evals=S.evals.filter(x=>!(x.tid===ui.tid&&x.year==ui.year&&x.cat===ui.cat));
    S.evals.push({id:uid(),tid:ui.tid,year:+ui.year,cat:ui.cat,pct,note:ui.note.trim(),scores});
    ui.draft={};ui.note="";save();render();
    if(pct>=S.pass){toast(`🎉 ${fmt(pct)} คะแนน ผ่านเกณฑ์เข้าทำเนียบ!`);confetti()}else toast(`บันทึกแล้ว ${fmt(pct)} คะแนน`)}
  if(act==="edit-t"){const f=document.querySelector(`[data-edit="${a.dataset.id}"]`);f.hidden=!f.hidden}
  if(act==="del-cat"){S.categories.splice(+a.dataset.i,1);save();render()}
  if(act==="install"&&window.hofInstall)window.hofInstall();
  if(act==="ec"){ui.ec=ui.ec===a.dataset.id?null:a.dataset.id;render()}
  if(act==="mv"){const i=S.criteria.findIndex(x=>x.id===a.dataset.id),j=i+ +a.dataset.d;if(S.criteria[j]){[S.criteria[i],S.criteria[j]]=[S.criteria[j],S.criteria[i]];save();render()}}
  if(act==="show-addc"){ui.addc=true;render();$("#c-n")?.focus()}
  if(act==="hide-addc"){ui.addc=false;render()}
  if(act==="upd-check"&&window.hofUpd)window.hofUpd.check();
  if(act==="upd-apply"&&window.hofUpd)window.hofUpd.apply();
  if(act==="upd-notif"&&window.hofUpd)window.hofUpd.enableNotif();
  if(act==="auto-year"){S.curYear=null;save();render()}
  if(act==="export-dl")download(`teacher-hall-of-fame-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S));
  if(act==="export-copy"){const txt=JSON.stringify(S);try{await navigator.clipboard.writeText(txt);toast("คัดลอกข้อมูลแล้ว 📋")}catch(_){const ta=$("#imp");ta.value=txt;ta.select();toast("คัดลอกอัตโนมัติไม่ได้ ข้อมูลอยู่ในช่องด้านล่าง กดคัดลอกเองได้เลย")}}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.score){ui.draft[t.dataset.score]=t.value;updSum()}
  if(t.id==="f-n")ui.note=t.value;
  if(t.id==="hq"){ui.hq=t.value;hallRes()}
  if(t.id==="f-y"){ui.year=+t.value||ui.year;updDup()}
  if(t.id==="t-q"){ui.q=t.value;const p=t.selectionStart;vTeachers();const n=$("#t-q");n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="f-t"){ui.tid=t.value;render()}
  if(t.id==="f-c"){ui.cat=t.value;updDup()}
  if(t.id==="hy"){ui.hy=t.value;hallRes()}
  if(t.id==="po-y"||t.id==="po-t"){if(t.id==="po-y")ui.posterYear=+t.value;else ui.posterTheme=+t.value;if(ui.poster){ui.poster.files.forEach(f=>URL.revokeObjectURL(f.url));ui.poster=null}posterOut()}
  if(t.id==="po-s"){S.school=t.value.trim();save()}
  if(t.id==="pdf-y"){ui.pdfYear=t.value;if(ui.pdf){URL.revokeObjectURL(ui.pdf.url);ui.pdf=null}pdfOut()}
  if(t.id==="p-t"){const w=$("#p-new");if(w)w.hidden=t.value!=="__new"}
  if(t.id==="p-c"){const w=$("#p-cn-w");if(w)w.hidden=t.value!=="__new"}
  if(t.id==="r-p"){S.pass=Math.min(100,Math.max(0,+t.value||0));save();toast("บันทึกคะแนนผ่านแล้ว ✅")}
  if(t.id==="r-y"){const y=+t.value;if(y>=2560){S.curYear=y;save();render();toast("ตั้งปีการศึกษาแล้ว ✅")}}
  if(t.id==="r-d"){const d=t.value.split("\n").map(x=>x.trim()).filter(Boolean);if(d.length){S.departments=d;save();toast("บันทึกกลุ่มสาระแล้ว ✅")}}
  if(t.id==="imp-f"&&t.files[0]){$("#imp").value=await t.files[0].text();toast("อ่านไฟล์แล้ว กดนำเข้าได้เลย")}
  if(t.id==="a-p"){const p=$("#a-prev");if(t.files[0]){try{p.src=await readPhoto(t.files[0]);p.hidden=false}catch(_){toast("อ่านไฟล์รูปไม่ได้")}}else p.hidden=true}
  if(t.id==="u-auto"&&window.hofUpd){window.hofUpd.setAuto(t.checked);toast(t.checked?"เปิดอัปเดตอัตโนมัติแล้ว ✅":"ปิดอัปเดตอัตโนมัติแล้ว จะแจ้งให้กดอัปเดตเอง")}
  const row=t.closest("[data-crit]");
  if(row&&t.dataset.f){const c=S.criteria.find(x=>x.id===row.dataset.crit),f=t.dataset.f;
    if(f==="active"){c.active=t.checked;save();render();return}
    if(f==="max")c.max=Math.max(1,+t.value||1);else if(f==="name"){if(t.value.trim())c.name=t.value.trim();else t.value=c.name}else if(f==="e")c.e=t.value.trim()||"✨";else c.desc=t.value;
    save();updCrit(row,c)}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="add-t"){const n=$("#a-n").value.trim();if(!n)return;let photo="";
    const file=$("#a-p").files[0];if(file){try{photo=await readPhoto(file)}catch(_){return toast("อ่านไฟล์รูปไม่ได้")}}
    S.teachers.push({id:uid(),name:n,dept:$("#a-d").value,photo});ui.sub.teachers="list";save();render();toast("เพิ่มคุณครูแล้ว 👩‍🏫")}
  if(f.dataset.edit){const t=teacher(f.dataset.edit);t.name=f.n.value.trim()||t.name;t.dept=f.d.value;
    if(f.p.files[0]){try{t.photo=await readPhoto(f.p.files[0])}catch(_){return toast("อ่านไฟล์รูปไม่ได้")}}else if(f.r&&f.r.checked)t.photo="";
    save();render();toast("บันทึกการแก้ไขแล้ว ✅")}
  if(f.id==="add-past"){
    let tid=$("#p-t").value;
    if(tid==="__new"){const n=$("#p-n").value.trim();if(!n)return toast("กรอกชื่อครูก่อนนะ");
      let photo="";const file=$("#p-p").files[0];if(file){try{photo=await readPhoto(file)}catch(_){return toast("อ่านไฟล์รูปไม่ได้")}}
      const ex=S.teachers.find(t=>t.name===n);
      if(ex){tid=ex.id;if(photo&&!ex.photo)ex.photo=photo}else{tid=uid();S.teachers.push({id:tid,name:n,dept:$("#p-d").value,photo})}}
    const yr=+$("#p-y").value;if(!(yr>=2400&&yr<=2700))return toast("ปีการศึกษาไม่ถูกต้อง ใช้ พ.ศ. เช่น 2566");
    let cat=$("#p-c").value;
    if(cat==="__new"){cat=$("#p-cn").value.trim();if(!cat)return toast("กรอกชื่อหมวดรางวัลก่อนนะ");if(!S.categories.includes(cat))S.categories.push(cat)}
    const sc=$("#p-s").value.trim(),pc=sc===""?null:Math.min(100,Math.max(0,+sc));
    S.evals=S.evals.filter(x=>!(x.tid===tid&&x.year===yr&&x.cat===cat));
    S.evals.push({id:uid(),tid,year:yr,cat,pct:pc!=null&&!isNaN(pc)?pc:null,note:$("#p-o").value.trim(),scores:[],past:true});
    ui.pastYear=yr;save();render();toast("เพิ่มเข้าทำเนียบแล้ว 📜 เพิ่มรายการต่อไปได้เลย")}
  if(f.id==="add-c"){const id=uid();S.criteria.push({id,name:$("#c-n").value.trim(),max:Math.max(1,+$("#c-m").value||10),desc:$("#c-d").value.trim(),active:true,e:"✨"});ui.addc=false;ui.ec=id;save();render();toast("เพิ่มหัวข้อแล้ว แก้ไอคอนได้ด้านล่าง ✅")}
  if(f.id==="add-cat"){const n=$("#k-n").value.trim();if(n&&!S.categories.includes(n)){S.categories.push(n);save();render()}}
});
addEventListener("popstate",()=>{if(tab==="rules"&&ui.sub.rules!=="menu"){ui.sub.rules="menu";ui.ec=null;render();scrollTo(0,0)}});

addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==tab){tab=h;render()}});

<script>
/* PWA: ติดตั้งลงหน้าจอโฮม + อัปเดตอัตโนมัติ + แจ้งเตือน
   ตรวจเจอรุ่นใหม่เองโดยเทียบไฟล์ index.html (ไม่ต้องแก้เลขเวอร์ชัน) และดูสถานะ service worker ควบคู่ */
(function(){
  var H=window.hofUpd={ok:false,available:false,checking:false,offline:false,last:0,build:"",auto:true,notif:"unsupported",bg:false,status:"",standalone:false};
  function safe(f,d){try{return f()}catch(e){return d}}
  function emit(){document.dispatchEvent(new Event("hof-upd"))}
  var standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;H.standalone=standalone;
  H.auto=safe(function(){return localStorage.getItem("hof-auto")},"1")!=="0";

  H.setAuto=function(v){H.auto=!!v;safe(function(){localStorage.setItem("hof-auto",v?"1":"0")});emit()};
  if(!/^https?:$/.test(location.protocol)||window.top!==window){H.status="การอัปเดตอัตโนมัติและการติดตั้งใช้ได้เมื่อเปิดผ่านเว็บ https เช่น GitHub Pages";return}
  if(!("serviceWorker" in navigator)){H.status="เบราว์เซอร์นี้ไม่รองรับการอัปเดตอัตโนมัติ";return}
  H.ok=true;

  var DKEY="hof-install-dismissed",ICON="icon-192.png",isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var deferred=null,reg=null,reloading=false,hadCtl=!!navigator.serviceWorker.controller,timer=null;
  function bar(id,html){var old=document.getElementById(id);if(old)old.remove();
    var d=document.createElement("div");d.className="pwa-bar";d.id=id;d.innerHTML='<div class="pwa-card" role="dialog" aria-live="polite"><img src="'+ICON+'" alt="">'+html+'</div>';document.body.appendChild(d);return d}
  function hide(id){var e=document.getElementById(id);if(e)e.remove()}
  function dismissed(){var t=+safe(function(){return localStorage.getItem(DKEY)},0);return t&&Date.now()-t<7*864e5}
  function toastMsg(m){var t=document.getElementById("toast");if(!t)return;t.textContent=m;t.hidden=false;clearTimeout(toastMsg.t);toastMsg.t=setTimeout(function(){t.hidden=true},3200)}
  function busy(){return !!(window.hofApp&&window.hofApp.busy())}
  function getLS(k){return safe(function(){return localStorage.getItem(k)},null)}
  function setLS(k,v){safe(function(){localStorage.setItem(k,v)})}

  /* ----- ติดตั้งแอป ----- */
  function showAndroid(){
    var d=bar("pwa-install",'<div class="tx"><b>📲 ติดตั้งแอปลงหน้าจอโฮม</b>เปิดได้ทันทีเหมือนแอปทั่วไป ใช้ออฟไลน์ได้</div><div class="bt"><button class="btn primary sm" id="pwa-go">ติดตั้ง</button><button class="btn sm" id="pwa-later">ไว้ทีหลัง</button></div>');
    d.querySelector("#pwa-go").onclick=doInstall;
    d.querySelector("#pwa-later").onclick=function(){safe(function(){localStorage.setItem(DKEY,Date.now())});hide("pwa-install")};
  }
  function showIOS(force){
    var d=bar("pwa-install",'<div class="tx"><b>📲 ติดตั้งลงหน้าจอโฮม</b>แตะปุ่มแชร์ <span class="emo">⬆️</span> ใน Safari แล้วเลือก “เพิ่มลงในหน้าจอโฮม” <span class="emo">➕</span></div><div class="bt"><button class="btn sm" id="pwa-ok">เข้าใจแล้ว</button></div>');
    d.querySelector("#pwa-ok").onclick=function(){if(!force)safe(function(){localStorage.setItem(DKEY,Date.now())});hide("pwa-install")};
  }
  function doInstall(){
    if(deferred){deferred.prompt();return deferred.userChoice.then(function(){deferred=null;hide("pwa-install")}).catch(function(){})}
    if(standalone)return toastMsg("ติดตั้งแอปไว้แล้ว 🎉");
    if(isIOS)return showIOS(true);
    toastMsg("เปิดเมนูเบราว์เซอร์ แล้วเลือก “ติดตั้งแอป” หรือ “เพิ่มลงหน้าจอหลัก”");
  }
  window.hofInstall=doInstall;
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;if(!standalone&&!dismissed()&&!H.available)setTimeout(showAndroid,2500)});
  window.addEventListener("appinstalled",function(){deferred=null;hide("pwa-install");toastMsg("ติดตั้งแอปเรียบร้อย 🎉")});
  if(isIOS&&!standalone&&!dismissed())setTimeout(function(){if(!document.getElementById("pwa-update"))showIOS(false)},3500);

  /* ----- ตรวจรุ่นใหม่ ----- */
  function hs(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
  function fetchBuild(){return fetch("index.html",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(hs)}
  function baseline(){ // รุ่นที่กำลังใช้อยู่ = ไฟล์ที่ service worker เก็บไว้ตอนเปิดหน้านี้
    var p=window.caches?caches.match("index.html",{ignoreSearch:true}).then(function(r){return r?r.text():null}).catch(function(){return null}):Promise.resolve(null);
    return p.then(function(t){return t?hs(t):fetchBuild()});
  }
  H.check=function(){
    if(H.checking)return Promise.resolve();H.checking=true;H.offline=false;emit();
    var jobs=[reg?reg.update().catch(function(){}):0,
      fetchBuild().then(function(h){if(!H.build)H.build=h;else if(h!==H.build)found(h)})];
    return Promise.all(jobs).catch(function(){H.offline=true}).then(function(){H.checking=false;H.last=Date.now();emit()});
  };
  H.apply=function(){
    if(H.pending)setLS("hof-try",H.pending);   // จำรุ่นที่สั่งอัปเดตแล้ว รุ่นเดียวกันจะไม่เด้งซ้ำอีก
    safe(function(){sessionStorage.setItem("hof-applied",Date.now())});
    if(reg&&reg.waiting){reg.waiting.postMessage("SKIP_WAITING");setTimeout(function(){location.reload()},1500)}else location.reload();
  };
  function found(h){
    if(H.available)return;
    if(h&&getLS("hof-try")===h){H.build=h;return}   // รุ่นนี้สั่งอัปเดตไปแล้ว ไม่ต้องเด้งซ้ำ
    H.pending=h||"";H.available=true;emit();
    if(h&&getLS("hof-skip")===h)return;             // ผู้ใช้กด ภายหลัง/ยกเลิก รุ่นนี้ไปแล้ว ไม่รบกวนอีก (ยังกดอัปเดตเองได้ใน ตั้งค่า)
    if(document.hidden){
      if(H.notif==="granted")notifyLocal();
      if(H.auto&&!busy()){H.apply();return}
    }
    showUpdate();
  }
  function showUpdate(){
    hide("pwa-install");clearInterval(timer);
    if(H.auto&&!busy())countdown(8);else manual(busy());
  }
  function manual(b){
    var d=bar("pwa-update",'<div class="tx"><b>🎉 มีเวอร์ชันใหม่แล้ว</b>'+(b?'คุณกำลังกรอกข้อมูลอยู่ จึงยังไม่อัปเดตให้เอง กดอัปเดตเมื่อบันทึกเสร็จ':'อัปเดตเพื่อรับฟีเจอร์และการแก้ไขล่าสุด ข้อมูลที่บันทึกแล้วจะไม่หาย')+'</div><div class="bt"><button class="btn primary sm" id="pwa-up">อัปเดตเลย</button><button class="btn sm" id="pwa-upl">ภายหลัง</button></div>');
    d.querySelector("#pwa-up").onclick=function(){this.textContent="กำลังอัปเดต…";H.apply()};
    d.querySelector("#pwa-upl").onclick=function(){if(H.pending)setLS("hof-skip",H.pending);hide("pwa-update")};
  }
  function countdown(n){
    var d=bar("pwa-update",'<div class="tx"><b>🎉 มีเวอร์ชันใหม่ กำลังอัปเดตอัตโนมัติ</b>อีก <span id="pwa-n">'+n+'</span> วินาที ข้อมูลที่บันทึกแล้วจะไม่หาย</div><div class="bt"><button class="btn primary sm" id="pwa-up">อัปเดตเลย</button><button class="btn sm" id="pwa-upl">ยกเลิก</button></div>');
    var sp=d.querySelector("#pwa-n");
    d.querySelector("#pwa-up").onclick=function(){clearInterval(timer);this.textContent="กำลังอัปเดต…";H.apply()};
    d.querySelector("#pwa-upl").onclick=function(){clearInterval(timer);if(H.pending)setLS("hof-skip",H.pending);hide("pwa-update")};
    timer=setInterval(function(){
      if(busy()){clearInterval(timer);manual(true);return}
      n--;if(n<=0){clearInterval(timer);H.apply();return}sp.textContent=n;
    },1000);
  }

  /* ----- แจ้งเตือน ----- */
  function notifyLocal(){if(reg&&reg.showNotification)reg.showNotification("ทำเนียบครูดีเด่น",{body:"มีเวอร์ชันใหม่ เปิดแอปเพื่ออัปเดต",icon:"icon-192.png",badge:"icon-192.png",tag:"hof-update"}).catch(function(){})}
  function regPeriodic(){
    if(!reg||!reg.periodicSync)return;
    reg.periodicSync.register("hof-update",{minInterval:6*3600*1000}).then(function(){H.bg=true;emit()}).catch(function(){});
  }
  H.enableNotif=function(){
    if(!("Notification" in window))return;
    Notification.requestPermission().then(function(p){H.notif=p;if(p==="granted")regPeriodic();emit()});
  };

  /* ----- ลงทะเบียน service worker ----- */
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(!hadCtl){hadCtl=true;return}   // ติดตั้งครั้งแรก ไม่ต้องรีโหลด
    if(reloading)return;reloading=true;location.reload()});
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(r){
      reg=r;
      if(H.notif==="granted")regPeriodic();
      // ตัว service worker ใหม่ที่รออยู่ ไม่ใช่เหตุให้แจ้งเตือน (หน้าเว็บใช้ "เน็ตก่อน" อยู่แล้ว) ให้ดูจากไฟล์ index.html ที่เปลี่ยนจริงเท่านั้น
      r.addEventListener("updatefound",function(){var n=r.installing;if(!n)return;n.addEventListener("statechange",function(){if(n.state==="installed"&&navigator.serviceWorker.controller)setTimeout(function(){H.check()},500)})});
    }).catch(function(){H.ok=false;H.status="ลงทะเบียนระบบอัปเดตไม่สำเร็จ";emit()});
    setTimeout(function(){baseline().then(function(h){H.build=h;emit();return H.check()}).catch(function(){})},1500);
    setInterval(function(){H.check()},15*60*1000);
    document.addEventListener("visibilitychange",function(){if(!document.hidden)H.check()});
    window.addEventListener("online",function(){H.check()});
  });
})();
</script>
</body>
</html>
